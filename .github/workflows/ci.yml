name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # mongodb-memory-server downloads a real mongod and runs the integration tests against it
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Show failing test output as an annotation
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          body=$(tail -n 150 test.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Test output::$body"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Show failing test output as an annotation
        if: failure()
        run: |
          [ -f test.log ] || exit 0
          body=$(tail -n 150 test.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Web test output::$body"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # A real browser against the real stack: Vite → Express API → MongoDB 7.
  e2e:
    runs-on: ubuntu-24.04
    needs: [server, web]
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      E2E_MONGODB_URI: mongodb://127.0.0.1:27017/taskflow_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Build the API
        working-directory: server
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'
        run: |
          npm ci
          npm run build
      - name: Install the web app and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: web
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
      - name: List e2e results as an annotation
        if: always()
        working-directory: web
        run: |
          [ -f e2e.log ] || exit 0
          body=$(grep -E '✓|✘|passed|failed|flaky|skipped' e2e.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=E2E results::$body"
      - name: Show failing e2e output as an annotation
        if: failure()
        working-directory: web
        run: |
          [ -f e2e.log ] || exit 0
          body=$(tail -n 150 e2e.log | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=E2E output::$body"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
