name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: Which view?
      options: [3D desk, 2D page (no WebGL), Sign-in / sign-up, API only]
  - type: input
    id: env
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Console or server logs
      render: text
