html, body { height: 100% }
body { background: var(--bg); color: var(--chrome-fg); font: 15px/1.5 var(--f-ui); overflow: hidden }
* { box-sizing: border-box }
.app { position: relative; height: 100%; }
#room { position: absolute; inset: 0 }
#room canvas { display: block; width: 100%; height: 100%; touch-action: none }
.bar { position: absolute; left: 16px; right: 16px; top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none }
.bar > * { pointer-events: auto }
.brand { display: flex; align-items: center; gap: 10px; background: var(--chrome); color: var(--chrome-fg); padding: 8px 14px 8px 10px; border-radius: 12px; backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.18) }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 700 15px/1 var(--f-ui) }
.brand b { font: 700 16px/1.1 var(--f-ui); letter-spacing: -.01em; display: block }
.brand span { font-size: 12.5px; color: var(--muted) }
.pill { background: var(--chrome); color: var(--chrome-fg); border: 0; border-radius: 99px; padding: 9px 14px; font: 600 13px/1 var(--f-ui); cursor: pointer; backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.18); display: inline-flex; gap: 8px; align-items: center }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #F5C66B; box-shadow: 0 0 8px #F5C66B; transition: background 400ms ease, box-shadow 400ms ease }
.pill.off .dot { background: #8F8B84; box-shadow: none }
.rail { position: absolute; left: 16px; right: 16px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none }
.rail-inner { pointer-events: auto; display: flex; gap: 4px; overflow-x: auto; max-width: 100%; background: var(--chrome); padding: 6px; border-radius: 14px; backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,.22); scrollbar-width: none }
.rail-inner::-webkit-scrollbar { display: none }
.rail button { flex: 0 0 auto; appearance: none; border: 0; background: transparent; color: var(--chrome-fg); font: 600 13px/1 var(--f-ui); padding: 9px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap }
.rail button:hover { background: var(--field) }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px }
.tag3d { position: absolute; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; background: var(--chrome); color: var(--chrome-fg); font: 600 12.5px/1 var(--f-ui); padding: 7px 10px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.25) }
.tag3d small { display: block; font-weight: 500; color: var(--muted); margin-top: 3px; font-size: 11px }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); color: #E9E2D6; font: 500 15px var(--f-ui); transition: opacity 420ms ease-out }
.loading.gone { opacity: 0; pointer-events: none }
.fallback { max-width: 460px; padding: 24px; text-align: center; line-height: 1.6 }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(12, 10, 8, .35); animation: fade 260ms ease-out }
.sheet.closing { animation: fadeout 180ms ease-in forwards }
.sheet.closing .card { animation: sink 180ms ease-in forwards }
@keyframes fade { from { background: rgba(12, 10, 8, 0) } }
@keyframes fadeout { to { background: rgba(12, 10, 8, 0) } }
@keyframes sink { to { transform: translateY(10px) scale(.985); opacity: 0 } }
.card { width: min(580px, 100%); max-height: min(86vh, 780px); overflow: auto; background: var(--card); color: var(--chrome-fg); border-radius: 16px; box-shadow: 0 30px 70px -20px rgba(0,0,0,.6); animation: rise 340ms cubic-bezier(.16, 1, .3, 1) }
@keyframes rise { from { transform: translateY(16px) scale(.985); opacity: 0 } to { transform: none; opacity: 1 } }
.card-head { position: sticky; top: 0; z-index: 1; background: var(--card); padding: 18px 20px 12px; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; justify-content: space-between; align-items: start }
.eyebrow { font: 600 11.5px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.card-head h2 { margin: 6px 0 0; font: 700 24px/1.15 var(--f-ui); letter-spacing: -.015em; text-wrap: balance }
.card-body { padding: 16px 20px 22px; display: grid; gap: 14px }
.btn { appearance: none; border: 1.5px solid var(--rule); background: transparent; color: var(--chrome-fg); font: 600 13.5px/1 var(--f-ui); padding: 10px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--chrome-fg) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { border-color: var(--warn); color: var(--warn) }
.btn.small { padding: 7px 10px; font-size: 12.5px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.fchip { appearance: none; border: 1.5px solid var(--rule); background: transparent; color: var(--chrome-fg); font: 600 12.5px/1 var(--f-ui); padding: 7px 11px; border-radius: 99px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center }
.fchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.fchip[aria-pressed="true"] { background: var(--chrome-fg); border-color: var(--chrome-fg); color: var(--card) }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--rule); border-left: 6px solid var(--catc, var(--rule)) }
.item.done .t { color: var(--muted) }
.item .t { font-weight: 600; cursor: pointer; background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; font-weight: 600 }
.item .t:hover { color: var(--accent) }
.meta { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted) }
.pr { font: 700 11px/1 var(--f-ui); padding: 4px 7px; border-radius: 6px }
.pr.High { color: var(--high); background: var(--high-bg) } .pr.Medium { color: var(--med); background: var(--med-bg) } .pr.Low { color: var(--low); background: var(--low-bg) }
.late { color: var(--warn); font-weight: 600 }
input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent) }
.field { display: grid; gap: 6px }
.field label, .lbl { font: 600 12.5px/1 var(--f-ui); color: var(--muted) }
.field input, .field select, .field textarea { font: 15px/1.35 var(--f-ui); padding: 10px 11px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--field); color: var(--chrome-fg); width: 100%; min-width: 0 }
.err { color: var(--warn); font-size: 13px; font-weight: 600 }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px }
@media (max-width: 480px) { .two { grid-template-columns: minmax(0, 1fr) } }
.note { font-size: 13px; color: var(--muted); margin: 0 }
.ok-msg { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--ok); font-weight: 500 }
.confirm { padding: 12px; border-radius: 12px; border: 1.5px solid var(--warn); display: grid; gap: 10px }
.subs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.subs li { display: flex; gap: 10px; align-items: center }
.subs li label { flex: 1; display: flex; gap: 10px; align-items: center; cursor: pointer }
.subs .x { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px }
.subs .x:hover { color: var(--warn) }
.progress { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden }
.progress span { display: block; height: 100%; background: var(--ok) }
.calnav { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.calnav strong { font: 700 18px/1 var(--f-ui) }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.tile { border: 1px solid var(--rule); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0 }
.tile b { font: 700 26px/1.1 var(--f-ui); font-variant-numeric: tabular-nums }
.tile span { font-size: 12px; color: var(--muted); line-height: 1.3 }
.tile.warn b { color: var(--warn) }
.days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 104px; padding: 4px 0 }
.day { display: grid; justify-items: center; align-content: end; gap: 4px; height: 100% }
.day .dbar { width: 60%; max-width: 30px; border-radius: 5px 5px 2px 2px; background: color-mix(in srgb, var(--accent) 45%, transparent) }
.day.now .dbar { background: var(--accent) }
.day .n { font: 600 12px/1 var(--f-mono); color: var(--chrome-fg) }
.day .d { font: 600 11px/1 var(--f-ui); color: var(--muted) }
.day.now .d { color: var(--chrome-fg) }
.catrow { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px }
.catrow .progress { height: 8px; border-radius: 4px }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px }
.mgrid .wd { font: 600 11px/1 var(--f-ui); color: var(--muted); text-align: center; padding-bottom: 2px }
.mgrid .d { min-height: 62px; border: 1px solid var(--rule); border-radius: 8px; padding: 4px; font: 500 11px/1 var(--f-mono); color: var(--muted); display: grid; align-content: start; gap: 3px; min-width: 0 }
.mgrid .d.today { border: 2px solid var(--accent); color: var(--chrome-fg) }
.mgrid .d.out { visibility: hidden }
.ct { appearance: none; border: 0; cursor: pointer; text-align: left; display: block; font: 600 10.5px/1.2 var(--f-ui); color: #23252A; padding: 2px 4px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.clock { font: 700 52px/1 var(--f-mono); font-variant-numeric: tabular-nums; text-align: center }
.mode { text-align: center; font: 600 12px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.center { display: grid; justify-items: center; gap: 8px }
.custom { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; justify-content: center }
.custom .field { width: 120px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
@media (max-width: 560px) { .brand span { display: none } .pill .txt { display: none } }
/* Frosted paper — from the "TaskFlow Glass — frosted paper" design (option A): a bit transparent, warm, paper-toned glass */
.card, .brand, .rail-inner, .tag3d { background: linear-gradient(135deg, var(--g-sheen), rgba(255, 255, 255, 0) 40%), var(--g-tint); -webkit-backdrop-filter: var(--g-blur); backdrop-filter: var(--g-blur); border: 0; color: var(--g-ink); box-shadow: var(--g-shadow), inset 1.5px 1.5px 0 var(--g-hi), inset -1px -1px 0 var(--g-lo) }
.brand, .rail-inner, .tag3d { box-shadow: 0 12px 30px -10px rgba(18, 10, 2, .45), inset 1.5px 1.5px 0 var(--g-hi), inset -1px -1px 0 var(--g-lo) }
.card { border-radius: 16px; color: var(--g-ink) }
.sheet { background: var(--g-veil) }
@keyframes fade { from { background: rgba(0, 0, 0, 0) } }
@keyframes fadeout { to { background: rgba(0, 0, 0, 0) } }
/* header: condensed eyebrow, handwritten title, ghost close */
.card-head { background: transparent; border-bottom: 0; padding: 22px 28px 12px; align-items: flex-end; -webkit-backdrop-filter: none; backdrop-filter: none; position: relative }
.eyebrow, .brand span { font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--g-sub) }
.card-head h2 { font: 700 44px/1 var(--f-script); letter-spacing: 0; margin-top: 6px; color: var(--g-ink) }
.card-body { padding: 8px 28px 26px; gap: 18px }
/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1.5px solid var(--pen); background: var(--g-btn); color: var(--pen); font: 600 14px/1 var(--f-ui) }
.btn:hover { border-color: var(--pen); background: var(--g-field) }
.btn.primary { background: var(--pen); border-color: var(--pen); color: var(--on-pen); box-shadow: 0 6px 14px var(--pen-glow) }
.btn.danger { border-color: var(--g-ink); color: var(--g-ink); background: var(--g-btn) }
.confirm .btn.danger { background: var(--coral); border-color: var(--coral); color: #fff }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px }
.btn.ghost, #sheet-close { border-color: transparent; background: transparent; padding: 0 10px; color: var(--g-ink); box-shadow: none }
#sheet-close:hover { background: var(--g-field) }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.fchip { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--g-ink); background: var(--g-field); color: var(--g-ink); font: 600 14px/1 var(--f-ui) }
.fchip[aria-pressed="true"] { background: var(--pen); border-color: var(--pen); color: var(--on-pen) }
.fchip:disabled { opacity: .45 }
.field label, .lbl { font: 600 13px/1 "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--g-sub) }
.field input, .field select, .field textarea { min-height: 44px; border: 0; border-bottom: 1.5px solid var(--g-ink); border-radius: 6px 6px 0 0; background: var(--g-field); color: var(--g-ink); font: 400 16px/1.3 var(--f-ui) }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-bottom-color: var(--pen); box-shadow: 0 2px 0 var(--pen) }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--pen) }
.note, .meta { color: var(--g-sub) }
/* priority pill: pastel tint + the Ring */
.pr { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 7px; border-radius: 99px; font: 600 12.5px/1 var(--f-ui); color: var(--pill-ink) }
.pr.High { background: var(--coral-t); color: var(--pill-ink) } .pr.Medium { background: var(--amber-t); color: var(--pill-ink) } .pr.Low { background: var(--mint-t); color: var(--pill-ink) }
.rg { display: block; flex: none; width: 16px; height: 16px }
.rg path { fill: none; stroke-width: 3.5 }
.rg .t3 { stroke: var(--ring-track); stroke-dasharray: 27.33 6 }
.rg .f3 { stroke-dasharray: 27.33 6 } .rg .f2 { stroke-dasharray: 27.33 6 27.33 6 0 100 } .rg .f1 { stroke-dasharray: 27.33 6 0 100 }
.rg .hi { stroke: var(--coral) } .rg .md { stroke: var(--amber) } .rg .lo { stroke: var(--mint) }
/* lists: ruled lines on the glass, not boxed cards */
.list { gap: 0; border-top: 1.5px solid var(--g-ink) }
.item { border: 0; border-bottom: 1px solid var(--g-line); border-radius: 0; background: transparent; padding: 10px 6px; min-height: 52px }
.item .t { font: 600 15px/1.25 var(--f-ui) }
.item.done .t { color: var(--g-sub) }
.subs { border-top: 1.5px solid var(--g-ink); gap: 0 }
.subs li { min-height: 44px; border-bottom: 1px solid var(--g-line) }
.subs .x { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--g-sub) }
.progress, .catrow .progress { background: var(--g-track); height: 8px; border-radius: 3px }
.progress span { background: var(--g-ink) }
/* frosted cells: tiles, calendar days, messages */

function leafGeo(kind) {
